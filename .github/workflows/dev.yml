name: "🚀 CI/CD Development"

on:
  push:
    branches:
      - "*"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: Development

    steps:
      - name: 📦 Checkout Code
        uses: actions/checkout@v4

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, zip, bcmath, xdebug
          coverage: none

      - name: 🧪 Run PHPUnit Tests (ignore failures)
        run: |
            if [ -f ./vendor/bin/phpunit ]; then
            ./vendor/bin/phpunit --testdox || echo "⚠️ Some tests failed, continuing..."
            else
            echo "⚠️ No tests found, skipping PHPUnit"
            fi
  
  push-docker:
    runs-on: ubuntu-latest
    environment: Development
    needs: build-and-deploy

    steps:
      - name: 📦 Checkout Code
        uses: actions/checkout@v4

      - name: 🔐 Docker Login
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: 📤 Build and Push Docker Image  
        run: |
          docker build -t kresnandaf/sipantau:latest .
          echo "Pushing Docker image..."        
          docker push kresnandaf/sipantau:latest

  deploy:
    runs-on: ubuntu-latest
    environment: Development
    needs: push-docker 

    steps:
      - name: 📦 Checkout Code
        uses: actions/checkout@v4

      - name: 🚢 Deploy to VPS Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "🔁 Pulling latest Docker image..."
            docker pull kresnandaf/sipantau:latest

            echo "🛑 Stopping old container (if exists)..."
            docker stop sipantau || true
            docker rm sipantau || true

            echo "🚀 Starting new container..."
            docker run -d \
              --name sipantau \
              --restart unless-stopped \
              --network development_mysql_dev_network \
              -p "${{ secrets.PORT }}":80 \
              -v sipantau:/app/storage \
              kresnandaf/sipantau:latest

            echo "⏳ Waiting for container to start..."
            sleep 10

            echo "⚙️ Running Laravel post-deploy commands..."
            docker exec sipantau php artisan migrate --seed
            docker exec sipantau php artisan storage:link
            docker exec sipantau php artisan config:cache
            docker exec sipantau php artisan route:cache
            docker exec sipantau php artisan view:cache
            docker exec sipantau php artisan optimize:clear
            docker exec sipantau php artisan optimize

            echo "🧹 Cleaning up unused Docker resources..."
            docker system prune -f